name: Tests

# ADR-0035: build, unit tests, dependency scan and the integration suites without ZooKeeper (which need a three-node
# ensemble and run for hours; change records record their manual runs)
on:
  pull_request:
  push:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Rebalancer.slnx -c Release

      - name: Unit Tests
        run: dotnet test tests/Rebalancer.UnitTests -c Release --no-build

      - name: Dependency Scan
        run: ./scripts/check-vulnerable-packages.sh Rebalancer.slnx

      # Docker on the hosted runner; at most 3 tests at once (xunit.runner.json), the network-fault tests alone
      - name: Integration Tests (without ZooKeeper)
        run: >-
          dotnet test tests/Rebalancer.IntegrationTests -c Release --no-build
          --filter "FullyQualifiedName!~ZooKeeper"
          --logger "console;verbosity=normal"
          -- xUnit.MaxParallelThreads=3
