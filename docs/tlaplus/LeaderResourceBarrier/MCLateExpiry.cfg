\* ZooKeeper may expire a session before its process notices (the disconnected timer is a third of the session
\* timeout), with disconnections and errors. Expected : no error (before ADR-0028, NoDoubleAccess was violated).
CONSTANTS
P = {p1, p2, p3}
R = {r1, r2}
LateExpiryNotice = TRUE
MaxSessions = 5
MaxEnvEvents = 3
MaxFailures = 2
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleAccess AccessHoldsBarrier
CHECK_DEADLOCK FALSE
