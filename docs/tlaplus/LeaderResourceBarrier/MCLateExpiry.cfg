\* ZooKeeper expires a session before its process notices (the disconnected timer is a third of the session
\* timeout). Expected: NoDoubleAccess is violated until ADR-0028 (see ../README.md).
CONSTANTS
  P = {p1, p2, p3}
  R = {r1, r2}
  LateExpiryNotice = TRUE
  SuspendOnDisconnect = FALSE
  MaxSessions = 5
  MaxEnvEvents = 3
  MaxFailures = 1
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleAccess
CHECK_DEADLOCK FALSE
