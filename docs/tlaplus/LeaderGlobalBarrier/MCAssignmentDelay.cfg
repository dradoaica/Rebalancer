\* PRB-0007 : with OnAssignmentDelay, a node starts a grant only on a tick after the delay, if its record still
\* grants the same resources under the same token. Safety without long stalls. Expected : no error.
CONSTANTS
N = {n1, n2, n3}
R = {r1, r2}
Nil = Nil
LongPauses = FALSE
MaxEnvEvents = 5
MaxFailures = 2
AssignmentDelay = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleAccess OneLeaseHolder
CHECK_DEADLOCK FALSE
