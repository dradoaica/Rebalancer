\* PRB-0007 with stalls longer than the lease / keep-alive expiry : a delayed start, also one whose delay elapsed
\* during the stall, keeps the ADR-0019 resume window. Expected : no error.
CONSTANTS
N = {n1, n2, n3}
R = {r1, r2}
Nil = Nil
LongPauses = TRUE
MaxEnvEvents = 3
MaxFailures = 2
AssignmentDelay = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneLeaseHolder NoDoubleAccessOutsideResumeWindow
CHECK_DEADLOCK FALSE
