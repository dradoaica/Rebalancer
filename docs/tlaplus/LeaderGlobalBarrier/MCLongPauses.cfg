\* Stalls longer than the lease / keep-alive expiry (PRB-0001, PRB-0003). With ADR-0026 a resumed node runs
\* reassigned resources only until its first heartbeat tick, and the lease stays exclusive.
\* Expected: no error (before ADR-0026, NoDoubleAccessOutsideResumeWindow was violated).
CONSTANTS
  N = {n1, n2, n3}
  R = {r1, r2}
  Nil = Nil
  LongPauses = TRUE
  MaxEnvEvents = 3
  MaxFailures = 2
SPECIFICATION Spec
INVARIANTS TypeOK OneLeaseHolder NoDoubleAccessOutsideResumeWindow
CHECK_DEADLOCK FALSE
