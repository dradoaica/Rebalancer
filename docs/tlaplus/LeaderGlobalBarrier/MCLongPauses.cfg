\* Stalls longer than the lease / keep-alive expiry (PRB-0001, PRB-0003). The lease stays exclusive,
\* but a resumed coordinator can run reassigned resources past its first heartbeat tick.
\* Expected: NoDoubleAccessOutsideResumeWindow is violated (see README.md).
\* To check that every double access ends, replace INVARIANTS with PROPERTIES EventuallyNoDoubleAccess
\* (MaxFailures = 1 keeps that run short).
CONSTANTS
  N = {n1, n2, n3}
  R = {r1, r2}
  Nil = Nil
  LongPauses = TRUE
  LeaseChecks = FALSE
  MaxEnvEvents = 3
  MaxFailures = 2
SPECIFICATION Spec
INVARIANTS TypeOK OneLeaseHolder NoDoubleAccessOutsideResumeWindow
CHECK_DEADLOCK FALSE
