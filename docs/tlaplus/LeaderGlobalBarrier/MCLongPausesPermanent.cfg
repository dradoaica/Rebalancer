\* Two long stalls : every double access ends. Before ADR-0026 a coordinator that regained the lease kept its
\* clients and resources from an earlier tenure, skipped rebalancing, and ran a reassigned resource forever.
\* Expected : no error (before ADR-0026, EventuallyNoDoubleAccess was violated).
CONSTANTS
N = {n1, n2, n3}
R = {r1, r2}
Nil = Nil
LongPauses = TRUE
MaxEnvEvents = 3
MaxFailures = 2
SPECIFICATION Spec
PROPERTIES EventuallyNoDoubleAccess
CHECK_DEADLOCK FALSE
