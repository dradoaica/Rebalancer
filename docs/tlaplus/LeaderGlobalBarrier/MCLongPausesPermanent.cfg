\* As built, two long stalls: a coordinator that regains the lease keeps its clients and resources from an
\* earlier tenure, skips rebalancing, and runs a resource another client also runs, forever.
\* Expected: EventuallyNoDoubleAccess is violated (see ../README.md).
CONSTANTS
  N = {n1, n2, n3}
  R = {r1, r2}
  Nil = Nil
  LongPauses = TRUE
  LeaseChecks = FALSE
  MaxEnvEvents = 3
  MaxFailures = 2
SPECIFICATION Spec
PROPERTIES EventuallyNoDoubleAccess
CHECK_DEADLOCK FALSE
