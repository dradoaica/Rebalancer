\* A follower that recovers from a store error (AutoRecoveryOnError) keeps its record Terminated,
\* so no coordinator includes it again. Expected: EventuallyConverged is violated (see README.md).
CONSTANTS
  N = {n1, n2, n3}
  R = {r1, r2}
  Nil = Nil
  LongPauses = FALSE
  LeaseChecks = FALSE
  MaxEnvEvents = 3
  MaxFailures = 1
SPECIFICATION Spec
PROPERTIES EventuallyConverged
CHECK_DEADLOCK FALSE
