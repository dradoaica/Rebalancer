<svg xmlns="http://www.w3.org/2000/svg" width="700" height="432" viewBox="0 0 700 432">
<style>
  text { font-family: Inter, 'DejaVu Sans', Arial, sans-serif; fill: #1f2937; }
  .label { font-size: 12.5px; fill: #374151; paint-order: stroke; stroke: #ffffff; stroke-width: 5px;
           stroke-linejoin: round; }
  .title { font-size: 14px; font-weight: 600; fill: #111827; }
  .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 12.5px; fill: #1f2937; }
  .on-dark { fill: #ffffff; font-weight: 600; font-size: 13px; }
  .state { font-size: 13px; font-weight: 500; fill: #1f2937; }
  .state-strong { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .actor { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
  .box-head { font-size: 13px; font-weight: 700; fill: #0f172a; }
  .box-text { font-size: 12.5px; fill: #374151; }
  .box-mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; fill: #1e3a5f; }
  .arrow { fill: none; stroke: #4b5563; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
           marker-end: url(#head); }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0.8 L 9 5 L 0 9.2 L 2.2 5 z" fill="#4b5563"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.18"/>
  </filter>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6cbf3c"/><stop offset="1" stop-color="#4e9a24"/>
  </linearGradient>
  <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b7889"/><stop offset="1" stop-color="#525e6d"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2aa7f0"/><stop offset="1" stop-color="#0f86d6"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f26a00"/><stop offset="0.45" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ef6400"/>
  </linearGradient>
  <linearGradient id="orange-top" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb26b"/><stop offset="1" stop-color="#ff9433"/>
  </linearGradient>
</defs>
<rect width="700" height="432" fill="#ffffff"/>
<circle cx="62" cy="62" r="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="62" y="66.5" class="state" text-anchor="middle">Start</text>
<circle cx="222" cy="62" r="44" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)"/>
<text x="222" y="58.5" class="state" text-anchor="middle">(Re)open</text>
<text x="222" y="74.5" class="state" text-anchor="middle">session</text>
<circle cx="410" cy="62" r="50" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)"/>
<text x="410" y="42.5" class="state" text-anchor="middle">Create</text>
<text x="410" y="58.5" class="state" text-anchor="middle">ephemeral</text>
<text x="410" y="74.5" class="state" text-anchor="middle">sequential</text>
<text x="410" y="90.5" class="state" text-anchor="middle">client znode</text>
<circle cx="410" cy="196" r="44" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
<text x="410" y="200.5" class="state-strong" text-anchor="middle">Leader</text>
<circle cx="410" cy="372" r="46" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="410" y="376.5" class="state-strong" text-anchor="middle">Follower</text>
<circle cx="600" cy="284" r="48" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)"/>
<text x="600" y="280.5" class="state" text-anchor="middle">Determine</text>
<text x="600" y="296.5" class="state" text-anchor="middle">leadership</text>
<path class="arrow" d="M 102 62 L 175 62"/>
<path class="arrow" d="M 266 62 L 357 62"/>
<path class="arrow" d="M 460 62 L 664 62 Q 674 62 674 72 L 674 274 Q 674 284 664 284 L 651 284"/>
<path class="arrow" d="M 600 236 L 600 206 Q 600 196 590 196 L 457 196"/>
<text x="528" y="189" class="label" text-anchor="middle">Smallest sibling</text>
<path class="arrow" d="M 600 332 L 600 362 Q 600 372 590 372 L 459 372"/>
<text x="528" y="365" class="label" text-anchor="middle">Not the smallest sibling</text>
<path class="arrow" d="M 410 326 L 410 243"/>
<text x="410" y="280.0" class="label" text-anchor="middle">Sibling watch notification</text>
<text x="410" y="295.5" class="label" text-anchor="middle">and smallest sibling</text>
<path class="arrow" d="M 366 196 L 232 196 Q 222 196 222 186 L 222 109"/>
<text x="236" y="134.0" class="label" text-anchor="start">BadVersion on epoch / resources</text>
<text x="236" y="149.5" class="label" text-anchor="start">Epoch notification</text>
<text x="236" y="165.0" class="label" text-anchor="start">Session expired</text>
<path class="arrow" d="M 364 372 L 212 372 Q 202 372 202 362 L 202 106"/>
</svg>
