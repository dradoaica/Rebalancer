<text x="412" y="371" class="box-mono" text-anchor="start">resource1/barrier: c_0000000003</text>
<text x="412" y="387" class="box-mono" text-anchor="start">resource2/barrier: c_0000000001</text>
<text x="412" y="403" class="box-mono" text-anchor="start">resource3/barrier: c_0000000002</text>
